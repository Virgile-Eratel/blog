name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Optimize images & update links
        run: |
          # 1. Convertit les photos de src/assets (et public/) en WebP 1600px max
          find public src -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) 2>/dev/null | while read -r img; do
            output="${img%.*}.webp"
            convert "$img" -auto-orient -resize "1600x>" -quality 80 -define webp:lossless=false "$output" && rm "$img"
          done

          # 2. Change uniquement l'extension .jpg/.png en .webp dans tes .md (garde le chemin relatif intact pour la preview Obsidian)
          find src -type f \( -name "*.md" -o -name "*.mdx" \) -exec sed -i -E 's/\.(jpg|jpeg|png)/.webp/gi' {} +

      - name: Commit optimized files back to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: optimize images to webp [skip ci]"
          file_pattern: 'public/** src/**'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
