name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Optimize images & fix Obsidian links
        run: |
          # 1. Convertit les images de public/ en WebP (1600px max, rotation EXIF auto)
          find public -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read -r img; do
            output="${img%.*}.webp"
            convert "$img" -auto-orient -resize "1600x>" -quality 80 -define webp:lossless=false "$output" && rm "$img"
          done

          # 2. Corrige les liens Markdown d'Obsidian (gère les dossiers public/images/ ou racine public/)
          find src -type f \( -name "*.md" -o -name "*.mdx" \) | while read -r md; do
            # Si tes images sont dans public/images/ :
            sed -i -E 's/!\[([^]]*)\]\((public\/)?(images\/)?([^)/]+)\.(jpg|jpeg|png)\)/![\1](\/images\/\4.webp)/gi' "$md"
          done

      - name: Commit optimized files back to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: optimize images to webp [skip ci]"
          file_pattern: 'public/** src/**'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
