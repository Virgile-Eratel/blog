name: Optimize & Convert Images to WebP

on:
  push:
    paths:
      - 'public/**/*.jpg'
      - 'public/**/*.JPG'
      - 'public/**/*.jpeg'
      - 'public/**/*.JPEG'
      - 'public/**/*.png'
      - 'public/**/*.PNG'
    branches:
      - main

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick & WebP
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp

      - name: Convert and compress images
        run: |
          find public -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read -r img; do
            output="${img%.*}.webp"
            # -auto-orient : garde le sens de la photo téléphone (EXIF)
            # -resize "1600x>" : réduit à 1600px de large MAX, touche pas si plus petit
            # && rm : supprime l'originale UNIQUEMENT si la conversion réussit
            convert "$img" -auto-orient -resize "1600x>" -quality 80 -define webp:lossless=false "$output" && rm "$img"
          done

      - name: Update Markdown references
        run: |
          # Remplace automatiquement .jpg/.png par .webp dans tes articles
          find src -type f \( -name "*.md" -o -name "*.mdx" \) -exec sed -i -E 's/\.(jpg|jpeg|png)/\L.webp/gi' {} +

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: optimize images to webp [skip ci]"
          file_pattern: 'public/** src/**'
